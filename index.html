<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twitch Stats</title>
  <meta name="description" content="Точная статистика Twitch-каналов в Telegram: онлайн каждую минуту, рейтинг, чаттеры, золотые моменты и рейды.">
  <meta name="theme-color" content="#0c0c10">
  <!-- Запоминаем параметры запуска до telegram-web-app.js: их нужно передать приложению бота как есть -->
  <script>window.__launch = { search: location.search, hash: location.hash };</script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap">
  <style>
    :root {
      --bg: #09090b; --cream: 243, 238, 229; --text: rgb(var(--cream)); --text-2: #bdb8ae; --hint: #86827b;
      --ok: #3ccf7e; --warn: #e0a83a;
      --font: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; --display: "Unbounded", var(--font);
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    /* Фон — у html, а не у body: фон body рисуется поверх холста со звёздами (z-index: -1) и прячет их */
    html {
      background:
        radial-gradient(ellipse 80% 45% at 50% 0%, rgba(120, 100, 200, 0.22), transparent 70%),
        radial-gradient(ellipse 70% 30% at 50% 100%, rgba(255, 120, 90, 0.08), transparent 70%),
        linear-gradient(180deg, #0c0c10, #09090b 60%, #070708);
      background-color: var(--bg);
    }
    body { margin: 0; min-height: 100vh; color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    main { max-width: 1040px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }

    /* Первый экран: звёздное небо, холмик и странник, который лежит и смотрит на звёзды */
    .scene {
      --land: clamp(190px, 36vh, 380px); position: relative; min-height: 100vh; min-height: 100svh; display: flex; overflow: hidden;
      /* Свечение у горизонта за холмом: на его фоне читаются силуэты */
      background:
        radial-gradient(ellipse 45% 24% at 38% calc(100% - var(--land) * 0.4), rgba(255, 150, 80, 0.2), transparent 70%),
        radial-gradient(ellipse 30% 18% at 78% calc(100% - var(--land) * 0.5), rgba(255, 175, 95, 0.12), transparent 70%),
        radial-gradient(ellipse 75% 32% at 58% calc(100% - var(--land) * 0.55), rgba(150, 128, 235, 0.3), rgba(100, 88, 190, 0.1) 45%, transparent 75%);
    }
    .scene-inner {
      position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 1040px; margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 16px calc(var(--land) * 0.92);
    }
    .scene .hero { margin: auto 0; }
    .land {
      position: absolute; left: 0; right: 0; bottom: -1px; height: var(--land); pointer-events: none;
      /* Низ холма растворяется в звёздном небе, по которому прокручивается остальная страница */
      -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent); mask-image: linear-gradient(to bottom, #000 62%, transparent);
    }
    .land svg { display: block; width: 100%; height: 100%; }

    .top { display: flex; align-items: center; gap: 10px; margin-bottom: clamp(36px, 8vw, 72px); }
    .logo { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(var(--cream), 0.16); display: grid; place-items: center; }
    .brand { font: 600 14px var(--display); letter-spacing: -0.02em; }

    .hero { text-align: center; }
    .hero h1 { margin: 0 0 16px; font: 800 clamp(38px, 9vw, 86px)/0.98 var(--display); letter-spacing: -0.05em; text-wrap: balance; }
    .hero h1 .sheen {
      background: linear-gradient(100deg, var(--text) 0 38%, #ff8a7a 48%, #c9b8ff 56%, var(--text) 66% 100%);
      background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: sheen 7s ease-in-out infinite;
    }
    @keyframes sheen { 0%, 20% { background-position: 100% 0; } 60%, 100% { background-position: 0 0; } }

    .status {
      /* Прозрачная: статус лежит прямо на небе, без стеклянной карточки */
      display: flex; align-items: center; gap: 16px; max-width: 560px; margin: 64px auto 0; padding: 18px 20px; text-align: left;
    }
    .status .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--hint); }
    .status[data-state="checking"] .dot { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
    .status[data-state="offline"] .dot { background: var(--warn); }
    .status[data-state="online"] .dot { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
    .status b { display: block; font: 600 16px/1.3 var(--display); letter-spacing: -0.02em; }
    .status span { display: block; margin-top: 3px; color: var(--hint); font-size: 13.5px; }
    .status .grow { flex: 1; min-width: 0; }
    .btn {
      flex: none; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; cursor: pointer;
      background: var(--text); color: #0b0b0d; font: 600 14px var(--font); text-decoration: none;
      display: inline-flex; align-items: center; transition: transform 0.15s var(--ease), opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; }
    @keyframes pulse { 50% { opacity: 0.35; } }

    footer { margin-top: 8px; text-align: center; color: var(--hint); font-size: 13px; }
    footer a { color: var(--text-2); }

    @media (max-width: 480px) {
      .status { flex-wrap: wrap; }
      .status .grow { flex-basis: calc(100% - 28px); }
      .status .btn { width: 100%; justify-content: center; }
    }
    @media (min-width: 720px) {
      main, .scene-inner { padding-left: 32px; padding-right: 32px; }
    }
    /* Живые холмы: трава колышется волной ветра, у костра пляшет пламя, светлячки, сова, лиса и заяц */
    .tuft { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.6s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    .fly { animation: drift 9s ease-in-out infinite; }
    .fly g { animation: blink 4s ease-in-out infinite; }
    @keyframes drift { 33% { transform: translate(9px, -11px); } 66% { transform: translate(-7px, -4px); } }
    @keyframes blink { 0%, 100% { opacity: 0.1; } 45%, 60% { opacity: 1; } }
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 0.9s ease-in-out infinite alternate; }
    @keyframes flicker { 0% { transform: none; } 50% { transform: scale(0.92, 1.12) skewX(3deg); } 100% { transform: scale(1.05, 0.9) skewX(-3deg); } }
    .warm { animation: warm 2.2s ease-in-out infinite alternate; }
    @keyframes warm { from { opacity: 0.78; } to { opacity: 1; } }
    .spark { opacity: 0; animation: rise 2.2s ease-out infinite; }
    @keyframes rise { 0% { opacity: 0; transform: none; } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -58px); } }
    .smoke { opacity: 0; transform-box: fill-box; transform-origin: center; animation: smoke 6s ease-out infinite; }
    @keyframes smoke { 0% { opacity: 0; transform: scale(0.6); } 20% { opacity: 0.5; } 100% { opacity: 0; transform: translate(10px, -34px) scale(1.8); } }
    .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scaleY(1.06); } }
    .owl-eyes { transform-box: fill-box; transform-origin: center; animation: owl-blink 5s infinite; }
    @keyframes owl-blink { 0%, 92%, 100% { transform: none; } 95% { transform: scaleY(0.1); } }
    .ears { transform-box: fill-box; transform-origin: 30% 100%; animation: twitch 7s ease-in-out infinite; }
    @keyframes twitch { 0%, 80%, 100% { transform: none; } 84% { transform: rotate(-12deg); } 88% { transform: rotate(4deg); } }

    @media (prefers-reduced-motion: reduce) {
      .sheen, .status .dot, .tuft, .fly, .fly g, .flame, .warm, .breathe, .owl-eyes, .ears { animation: none !important; }
      .spark, .smoke { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <header class="scene">
    <div class="scene-inner">
    <div class="top">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      </div>
      <span class="brand">twitch stats</span>
    </div>

    <section class="hero">
      <h1>Twitch <span class="sheen">статистика</span></h1>
      <div class="status" id="status" data-state="checking" role="status" aria-live="polite">
        <i class="dot" aria-hidden="true"></i>
        <div class="grow"><b id="status-title">Подключаемся к боту…</b><span id="status-text">Проверяем, в сети ли он.</span></div>
        <button class="btn" id="retry" type="button" hidden>Проверить</button>
      </div>
    </section>
    </div>

    <div class="land" aria-hidden="true">
      <svg viewBox="250 50 960 230" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#ff6a2a"/><stop offset="0.6" stop-color="#ffa84a"/><stop offset="1" stop-color="#ffe08a"/>
          </linearGradient>
          <radialGradient id="firelight">
            <stop offset="0" stop-color="#ff9a4a" stop-opacity="0.5"/><stop offset="0.35" stop-color="#ff8a3a" stop-opacity="0.18"/><stop offset="1" stop-color="#ff7a30" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="windowlight">
            <stop offset="0" stop-color="#ffc66a" stop-opacity="0.45"/><stop offset="1" stop-color="#ffb050" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path id="hill-far" d="M-10 330 L-10 198 C180 168 330 150 470 164 C600 177 640 204 720 199 C820 193 900 150 1060 140 C1200 131 1330 164 1450 174 L1450 330 Z" fill="#16141f"/>

        <g id="mid-life" fill="#0f0e16"></g>

        <!-- Странник: лежит на спине, руки за головой, одно колено поднято; рядом шляпа и посох с котомкой -->
        <g fill="#08080a">
          <path d="M850 160 L866 92 L869.5 93 L854.5 160 Z"/>
          <path d="M866 96 C860 97 857 103 858 109 C859 116 866 119 872 117 C879 115 882 108 880 102 C878 97 872 95 866 96 Z"/>
          <path d="M865 97 L870 90 L873 92 L869 98 Z"/>
          <g transform="translate(764 151) rotate(-2.4)">
            <circle cx="44" cy="-7" r="6.5"/>
            <path d="M30 -10 L47 -21 C49 -22 52 -20 51 -17 L42 -9 Z"/>
            <path d="M38 4 L38 -6 C38 -9 33 -12 26 -12 L-2 -10 C-6 -9.5 -8 -6 -8 4 Z"/>
            <path d="M-6 -9 L-48 -5 C-51 -5 -52 -9 -55 -9 C-58 -9 -58 -4 -57 4 L-6 4 Z"/>
            <path d="M-4 -10 L-24 -30 C-26 -32 -30 -31 -31 -28 L-42 -6 L-48 -6 L-49 4 L-36 4 L-36 -1 L-27 -18 L-10 4 Z"/>
            <ellipse cx="70" cy="-1" rx="10" ry="2.2"/>
            <path d="M63 -1 C63 -9 77 -9 77 -1 Z"/>

        <path id="hill-front" d="M-10 330 L-10 262 C200 255 430 236 570 196 C650 172 700 152 762 149 C828 146 890 160 975 192 C1110 240 1300 258 1450 254 L1450 330 Z"
          fill="#08080a" stroke="rgba(255,196,130,0.24)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
        <g id="front-life" fill="#08080a"></g>
        <g id="grass" fill="#08080a"></g>
        <g id="fire"></g>
        <g id="flies"></g>
      </svg>
    </div>
  </header>

  <main>
    <footer>Twitch Stats · <a id="bot-link" href="https://t.me/MyStatstwitch_bot">@MyStatstwitch_bot</a></footer>
  </main>

  <script>
    // Витрина и «пусковая площадка»: проверяем, в сети ли бот, и если да — открываем его приложение.
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var RETRY_MS = 20000;
      var PING_TIMEOUT_MS = 5000;
      // Куда можно перенаправлять: только https и только адреса туннеля или сервера бота
      var ALLOWED_HOSTS = [/\.trycloudflare\.com$/, /\.sslip\.io$/, /\.nip\.io$/];

      var el = {
        status: document.getElementById("status"),
        title: document.getElementById("status-title"),
        text: document.getElementById("status-text"),
        retry: document.getElementById("retry"),
      };

      function setState(state, title, text) {
        el.status.dataset.state = state;
        el.title.textContent = title;
        el.text.textContent = text;
        el.retry.hidden = state !== "offline";
      }

      function backendOrigin() {
        var raw = new URLSearchParams(window.__launch.search).get("backend");
        if (!raw) return null;
        try {
          var url = new URL(raw);
          if (url.protocol !== "https:") return null;
          var ok = ALLOWED_HOSTS.some(function (re) { return re.test(url.hostname); });
          return ok ? url.origin : null;
        } catch (e) {
          return null;
        }
      }

      // Адрес приложения: параметры запуска (кроме backend) и данные Telegram из # передаём как есть.
      function appUrl(origin) {
        var params = new URLSearchParams(window.__launch.search);
        params.delete("backend");
        var query = params.toString();
        return origin + "/" + (query ? "?" + query : "") + window.__launch.hash;
      }

      // Проверка картинкой: не нужен CORS, а упавший туннель отдаёт ошибку или молчит.
      function ping(origin) {
        return new Promise(function (resolve) {
          var img = new Image();
          var timer = setTimeout(function () { img.src = ""; resolve(false); }, PING_TIMEOUT_MS);
          img.onload = function () { clearTimeout(timer); resolve(true); };
          img.onerror = function () { clearTimeout(timer); resolve(false); };
          img.src = origin + "/static/img/logo.svg?ping=" + Date.now();
        });
      }

      var origin = backendOrigin();
      var retryTimer = null;

      function check() {
        clearTimeout(retryTimer);
        setState("checking", "Подключаемся к боту…", "Проверяем, в сети ли он.");
        ping(origin).then(function (online) {
          if (online) {
            setState("online", "Бот в сети", "Открываем приложение…");
            fullscreenReady.then(function () { window.location.replace(appUrl(origin)); });
            return;
          }
          setState("offline", "Бот сейчас отдыхает",
            "Сбор статистики на паузе. Как только бот вернётся, эта страница сама откроет приложение.");
          retryTimer = setTimeout(check, RETRY_MS);
        });
      }

      // На компьютере открываемся во весь экран сразу на витрине: после перехода
      // на адрес бота Telegram может уже не принять запрос, а режим сохраняется.
      // Крестик в полноэкранном режиме сначала сворачивает в окно — тогда закрываем сразу.
      var DESKTOP_PLATFORMS = ["tdesktop", "macos", "web", "weba", "webk"];
      var FULLSCREEN_WAIT_MS = 800;

      function enterFullscreen() {
        return new Promise(function (resolve) {
          var canFullscreen = tg && DESKTOP_PLATFORMS.indexOf(tg.platform) !== -1 &&
            tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && typeof tg.requestFullscreen === "function";
          if (!canFullscreen || tg.isFullscreen) { resolve(); return; }
          var wasFullscreen = false;
          var timer = setTimeout(resolve, FULLSCREEN_WAIT_MS);
          function settle() { clearTimeout(timer); resolve(); }
          tg.onEvent("fullscreenChanged", function () {
            if (tg.isFullscreen) { wasFullscreen = true; settle(); }
            else if (wasFullscreen) tg.close();
          });
          tg.onEvent("fullscreenFailed", function () {
            if (tg.isFullscreen) wasFullscreen = true; // уже во весь экран
            settle();
          });
          try { tg.requestFullscreen(); } catch (e) { settle(); }
        });
      }

      var fullscreenReady = Promise.resolve();
      if (tg) {
        try {
          tg.ready();
          tg.expand();
          if (tg.isVersionAtLeast && tg.isVersionAtLeast("6.1")) { tg.setHeaderColor("#0c0c10"); tg.setBackgroundColor("#0c0c10"); }
          fullscreenReady = enterFullscreen();
        } catch (e) { /* вне Telegram — просто страница */ }
      }

      el.retry.addEventListener("click", check);
      if (origin) {
        check();
      } else {
        // Открыли витрину напрямую, не из бота
        setState("idle", "Откройте бота в Telegram", "Там появится кнопка «Статистика» — она откроет приложение.");
        var open = document.createElement("a");
        open.className = "btn";
        open.href = document.getElementById("bot-link").href;
        open.textContent = "Открыть";
        el.status.appendChild(open);
      }


      startSky(document.getElementById("stars"));
      growLand();
    })();

    // Оживляем холмы. Силуэты рисуются в своих координатах (земля — y = 0) и ставятся на гребень холма.
    // Функция, а не переменная: growLand вызывается выше по коду, а объявления функций поднимаются целиком
    function landShapes() {
      return {
      oak: '<path d="M-6 4 L-5 -38 C-5 -48 -11 -56 -19 -62 L-16 -65 C-9 -60 -4 -55 -1 -50 C2 -58 8 -64 15 -68 L18 -65 C10 -59 5 -52 5 -42 L7 4 Z"/>' +
        '<circle cx="0" cy="-88" r="30"/><circle cx="-26" cy="-74" r="22"/><circle cx="26" cy="-76" r="24"/><circle cx="-14" cy="-106" r="22"/>' +
        '<circle cx="16" cy="-104" r="22"/><circle cx="34" cy="-60" r="14"/><circle cx="-2" cy="-64" r="18"/>',
      owl: '<path d="M-4 -38 L-62 -47 L-62 -44 L-4 -33 Z"/>' + // ветка, на которой сидит сова
        '<ellipse cx="-54" cy="-55" rx="5.5" ry="8"/><path d="M-59 -60 L-58 -67 L-55 -61 Z M-49 -60 L-50 -67 L-53 -61 Z"/>' +
        '<g class="owl-eyes" fill="#ffcf6a"><circle cx="-56.3" cy="-57.5" r="1.3"/><circle cx="-51.7" cy="-57.5" r="1.3"/></g>',
      fox: '<g transform="scale(-1.8 1.8)" fill="#5a3220"><g class="breathe"><ellipse cx="0" cy="-7" rx="13" ry="7.5"/><circle cx="-10" cy="-7" r="5.2"/>' +
        '<path d="M-14 -10 L-13 -17.5 L-9.5 -11 Z M-9 -11 L-6.5 -17 L-5 -10.5 Z M-15 -5 L-21.5 -3.5 L-15 -1.5 Z"/>' +
        '<path d="M10 -5 C19 -3 17 5 4 4 C-6 3 -13 3 -18 1 L-17 3.5 C-9 6.5 6 7.5 12 4 C19 0.5 17 -7 10 -7 Z"/>' +
        '<ellipse cx="-17" cy="2.2" rx="3" ry="1.6" fill="#e9dccb" opacity="0.6"/></g></g>',
      cottage: '<g fill="#221e2e"><rect x="-14" y="-18" width="28" height="21"/><path d="M-18 -17 L0 -31 L18 -17 Z"/><rect x="7" y="-34" width="4.5" height="12"/></g>' +
        '<circle class="warm" cx="0" cy="-10" r="28" fill="url(#windowlight)"/>' +
        '<rect class="warm" x="-9" y="-12" width="6" height="6" fill="#ffc35e"/><rect class="warm" x="3" y="-12" width="6" height="6" fill="#ffc35e"/>' +
        '<circle class="smoke" cx="9" cy="-37" r="3" fill="rgb(210,200,230)"/>' +
        '<circle class="smoke" cx="9" cy="-37" r="3" fill="rgb(210,200,230)" style="animation-delay:-2s"/>' +
        '<circle class="smoke" cx="9" cy="-37" r="3" fill="rgb(210,200,230)" style="animation-delay:-4s"/>',
      lantern: '<circle class="warm" cy="-8" r="34" fill="url(#windowlight)"/>' +
        '<rect class="warm" x="-4" y="-13" width="8" height="11" rx="1.5" fill="#ffcf73"/>' +
        '<path d="M-5 -2 h10 v2.5 h-10 Z M-4.5 -15.5 h9 v2.5 h-9 Z" fill="#1a1410"/>' +
        '<path d="M-2.2 -15.5 Q0 -20.5 2.2 -15.5" fill="none" stroke="#1a1410" stroke-width="1"/>',
      rabbit: '<g transform="scale(1.4)"><ellipse cx="0" cy="-5" rx="7" ry="5"/><circle cx="6.5" cy="-9.5" r="3.6"/><circle cx="-7" cy="-6" r="2"/>' +
        '<g class="ears"><path d="M5 -12.5 L3.8 -22 L6.3 -22.3 L7 -12.5 Z M7.6 -12.5 L9 -21 L11 -20.4 L9.2 -12 Z"/></g></g>',
      fire: '<ellipse class="warm" cy="-10" rx="135" ry="80" fill="url(#firelight)"/>' +
        '<ellipse cx="-13" cy="2" rx="3.6" ry="2.4" fill="#141114"/><ellipse cx="-5" cy="3" rx="3.6" ry="2.4" fill="#141114"/>' +
        '<ellipse cx="5" cy="3" rx="3.6" ry="2.4" fill="#141114"/><ellipse cx="13" cy="2" rx="3.6" ry="2.4" fill="#141114"/>' +
        '<path class="flame" d="M-1 0 C-9 -4 -8 -15 -1 -28 C6 -15 8 -4 -1 0 Z" fill="url(#flame)"/>' +
        '<path class="flame" style="animation-duration:.7s" d="M-6 0 C-12 -3 -11 -11 -7 -18 C-2 -11 -1 -4 -6 0 Z" fill="url(#flame)"/>' +
        '<path class="flame" style="animation-duration:1.1s;animation-delay:-.4s" d="M5 0 C0 -3 0 -12 5 -20 C10 -12 11 -3 5 0 Z" fill="url(#flame)"/>' +
        '<path class="flame" style="animation-duration:.6s" d="M-1 0 C-4 -3 -4 -9 -1 -15 C2 -9 3 -3 -1 0 Z" fill="#fff0b8" opacity="0.85"/>' +
        '<path d="M-12 2 L10 -4 L11 -1 L-11 5 Z" fill="#24170f"/><path d="M-10 -4 L12 2 L11 5 L-11 -1 Z" fill="#2a1a10"/>',
      };
    }

    function growLand() {
      var LAND_SHAPES = landShapes();
      var SVG_NS = "http://www.w3.org/2000/svg";
      var VISIBLE_X = [240, 1220];       // видимая часть сцены по viewBox
      var FIGURE_X = [690, 885];         // у странника трава ниже — чтобы не закрывала его
      var FIRE_X = 672, LANTERN_X = 862, OAK_X = 560, FOX_X = 641, COTTAGE_X = 1110, RABBIT_X = 1190;

      function el(name, attrs, parent) {
        var node = document.createElementNS(SVG_NS, name);
        Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
        if (parent) parent.appendChild(node);
        return node;
      }
      function rand(a, b) { return a + Math.random() * (b - a); }
      function pick(ranges) { var r = ranges[Math.floor(Math.random() * ranges.length)]; return rand(r[0], r[1]); }

      // Точки верхнего края холма слева направо
      function ridge(id, step) {
        var path = document.getElementById(id);
        if (!path || !path.getTotalLength) return [];
        var total = path.getTotalLength(), pts = [];
        for (var l = 0; l < total; l += step) {
          var pt = path.getPointAtLength(l);
          if (pt.y < 290 && pt.x >= VISIBLE_X[0] && pt.x <= VISIBLE_X[1]) pts.push(pt);
        }
        return pts;
      }
      function nearestIndex(pts, x) {
        var best = 0;
        for (var i = 1; i < pts.length; i++) if (Math.abs(pts[i].x - x) < Math.abs(pts[best].x - x)) best = i;
        return best;
      }
      // Ставит силуэт на гребень в точке x; tilt — наклонить по склону (лиса, трава), иначе стоит прямо
      function place(parent, pts, x, markup, tilt) {
        var i = nearestIndex(pts, x), pt = pts[i];
        var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        var angle = tilt ? Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI : 0;
        var g = el("g", { transform: "translate(" + pt.x.toFixed(1) + " " + (pt.y + 1).toFixed(1) + ") rotate(" + angle.toFixed(1) + ")" }, parent);
        if (markup) g.innerHTML = markup; // разметка — константы этой страницы, не данные извне
        return g;
      }

      var layers = { far: ridge("hill-far", 4), mid: ridge("hill-mid", 4), front: ridge("hill-front", 4) };
      if (!layers.front.length) return;
      plantFar(document.getElementById("far-life"), layers.far);
      plantMid(document.getElementById("mid-life"), layers.mid);
      plantFront(document.getElementById("front-life"), layers.front);
      plantGrass(document.getElementById("grass"), layers.front);
      lightFire(document.getElementById("fire"), layers.front);
      releaseFireflies(document.getElementById("flies"));

      function pine(parent, pts, x, h) {
        var w = h * 0.42;
        place(parent, pts, x, '<path d="M' + (-w / 2) + ' 3 L0 ' + (-h) + ' L' + (w / 2) + ' 3 Z"/>' +
          '<path d="M' + (-w * 0.62) + ' ' + (3 - h * 0.18) + ' L0 ' + (-h * 0.62) + ' L' + (w * 0.62) + ' ' + (3 - h * 0.18) + ' Z"/>');
      }
      function bush(parent, pts, x, size) {
        place(parent, pts, x, '<circle cx="' + (-size * 0.6) + '" cy="' + (-size * 0.35) + '" r="' + (size * 0.6) + '"/>' +
          '<circle cx="0" cy="' + (-size * 0.65) + '" r="' + (size * 0.75) + '"/>' +
          '<circle cx="' + (size * 0.65) + '" cy="' + (-size * 0.3) + '" r="' + (size * 0.55) + '"/>');
      }

      function oak(parent, pts, x, scale) {
        place(parent, pts, x, '<g transform="scale(' + scale + ')">' + LAND_SHAPES.oak + '</g>');
      }

      // Дальний гребень: сосновые рощи и домик с тёплыми окнами и дымком из трубы
      function plantFar(g, pts) {
        if (!g || !pts.length) return;
        [[990, 16], [1004, 22], [1018, 17], [1034, 24], [1050, 18], [1160, 15], [1176, 21], [1190, 27], [1206, 18], [1222, 23], [1238, 15],
          [340, 16], [352, 22], [366, 15], [432, 13], [446, 18], [458, 12]].forEach(function (t) { pine(g, pts, t[0], t[1]); });
        place(g, pts, COTTAGE_X, LAND_SHAPES.cottage);
        place(g, pts, 395, '<g transform="scale(0.8)">' + LAND_SHAPES.cottage + '</g>');
        [[505, 0.42], [538, 0.34], [1128, 0.3]].forEach(function (t) { oak(g, pts, t[0], t[1]); });
      }

      // Средний гребень: кусты, сосны и заяц
      function plantMid(g, pts) {
        if (!g || !pts.length) return;
        [[330, 26], [348, 32], [370, 22], [492, 24], [508, 30]].forEach(function (t) { pine(g, pts, t[0], t[1]); });
        for (var i = 0; i < 14; i++) bush(g, pts, pick([[320, 560], [1000, 1270]]), rand(6, 12));
        [[1060, 0.55], [1150, 0.45], [272, 0.5]].forEach(function (t) { oak(g, pts, t[0], t[1]); });
        place(g, pts, RABBIT_X, LAND_SHAPES.rabbit);
      }

      // Передний холм: дубовая роща (на главном дубе сова), кусты по склонам, лиса спит у костра
      function plantFront(g, pts) {
        if (!g) return;
        for (var i = 0; i < 10; i++) bush(g, pts, pick([[320, 500], [600, 630], [950, 1270]]), rand(7, 14));
        [[330, 0.9], [428, 0.72], [990, 0.85], [1180, 0.72]].forEach(function (t) { oak(g, pts, t[0], t[1]); });
        place(g, pts, OAK_X, LAND_SHAPES.oak + LAND_SHAPES.owl);
        place(g, pts, FOX_X, LAND_SHAPES.fox, true);
      }

      function blade(parent, bx, h, lean) {
        el("path", { d: "M" + (bx - 0.9) + " 1 Q" + (bx + lean * 0.3) + " " + (-h * 0.5) + " " + (bx + lean) + " " + (-h) +
          " Q" + (bx + lean * 0.3 + 0.7) + " " + (-h * 0.5) + " " + (bx + 0.9) + " 1 Z" }, parent);
      }
      // Густая трава по всей вершине; у костра в ней светятся цветы
      function plantGrass(g, pts) {
        if (!g) return;
        var WIND_WAVE_S = 320; // единиц viewBox за секунду: порыв ветра бежит по склону
        pts.filter(function (pt, i) { return i % 2 === 0; }).forEach(function (pt) {
          var nearFigure = pt.x > FIGURE_X[0] && pt.x < FIGURE_X[1];
          // У костра и спящей лисы травы нет — иначе она их закрывает
          if (Math.abs(pt.x - FIRE_X) < 18 || Math.abs(pt.x - FOX_X) < 26) return;
          var scale = nearFigure ? 0.45 : rand(0.75, 1.35);
          var tuft = el("g", { class: "tuft" }, place(g, [pt], pt.x));
          tuft.style.animationDelay = (-pt.x / WIND_WAVE_S).toFixed(2) + "s";
          tuft.style.animationDuration = rand(3, 4.4).toFixed(2) + "s";
          for (var i = 0, n = 3 + Math.floor(Math.random() * 3); i < n; i++) blade(tuft, rand(-4, 4), rand(9, 22) * scale, rand(-4, 5));
          if (Math.abs(pt.x - FIRE_X) < 140 && Math.random() < 0.35) {
            var h = rand(10, 16) * scale;
            blade(tuft, 0, h, 1);
            el("circle", { cx: 1, cy: -h, r: 1.7, fill: Math.random() < 0.5 ? "#ffd7a8" : "#f2b7c6", opacity: 0.8 }, tuft);
          }
        });
      }

      // Костёр у ног странника: отсвет на холме, пламя и искры
      function lightFire(g, pts) {
        if (!g) return;
        place(g, pts, LANTERN_X, LAND_SHAPES.lantern);
        var fire = place(g, pts, FIRE_X, LAND_SHAPES.fire);
        for (var i = 0; i < 8; i++) {
          var spark = el("circle", { class: "spark", cx: rand(-4, 4).toFixed(1), cy: -14, r: rand(0.7, 1.2).toFixed(1), fill: "#ffc070" }, fire);
          spark.style.setProperty("--dx", rand(-14, 14).toFixed(0) + "px");
          spark.style.animationDuration = rand(1.6, 2.8).toFixed(1) + "s";
          spark.style.animationDelay = (-rand(0, 2.8)).toFixed(1) + "s";
        }
      }

      function releaseFireflies(g) {
        if (!g) return;
        for (var i = 0; i < 48; i++) {
          var spot = el("g", { transform: "translate(" + rand(260, 1200).toFixed(0) + " " + rand(115, 265).toFixed(0) + ")" }, g);
          var fly = el("g", { class: "fly" }, spot);
          fly.style.animationDuration = rand(7, 13).toFixed(1) + "s";
          fly.style.animationDelay = (-rand(0, 13)).toFixed(1) + "s";
          var glow = el("g", {}, fly);
          glow.style.animationDuration = rand(2.6, 5.2).toFixed(1) + "s";
          glow.style.animationDelay = (-rand(0, 5)).toFixed(1) + "s";
          el("circle", { r: rand(3.5, 6.5).toFixed(1), fill: "#ffd98a", opacity: 0.2 }, glow);
          el("circle", { r: 1.3, fill: "#fff1c9" }, glow);
        }
      }
    }

    // Звёздное небо: Млечный Путь, мерцающие звёзды-искры и редкие падающие звёзды.
    function startSky(canvas) {
      var ctx = canvas.getContext("2d");
      if (!ctx) return;
      var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var TINTS = ["243,238,229", "201,179,255", "190,226,255"];
      var TINT_ROLL = [0.8, 0.93];         // доли тёплых белых и сиреневых, остальные — ледяные
      var STAR_AREA = 3600;                // CSS-пикселей² неба на одну мерцающую звезду
      var DUST_AREA = 650;                 // и на одну пылинку Млечного Пути
      var SPARKLE_SHARE = 0.05;            // столько звёзд — крупные искры с лучами
      var SPRITE_PX = 64;
      var METEOR_GAP_MS = [5000, 13000];   // пауза между падающими звёздами
      var METEOR_MS = 950;
      var w = 0, h = 0, dpr = 1, stars = [], milkyWay = null, meteor = null, nextMeteor = 0;
      var sprites = TINTS.map(makeSprite);

      function makeSprite(color) {
        var c = document.createElement("canvas");
        c.width = c.height = SPRITE_PX;
        var g = c.getContext("2d");
        var r = SPRITE_PX / 2;
        var glow = g.createRadialGradient(r, r, 0, r, r, r);
        glow.addColorStop(0, "rgba(" + color + ",0.55)");
        glow.addColorStop(0.25, "rgba(" + color + ",0.15)");
        glow.addColorStop(1, "rgba(" + color + ",0)");
        g.fillStyle = glow;
        g.fillRect(0, 0, SPRITE_PX, SPRITE_PX);
        g.translate(r, r);
        g.fillStyle = "rgb(" + color + ")";
        g.beginPath();
        for (var i = 0; i < 4; i++) {
          var a = i * Math.PI / 2;
          g.lineTo(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62);
          g.lineTo(Math.cos(a + Math.PI / 4) * r * 0.1, Math.sin(a + Math.PI / 4) * r * 0.1);
        }
        g.closePath();
        g.fill();
        return c;
      }

      function tint() {
        var roll = Math.random();
        return roll < TINT_ROLL[0] ? 0 : roll < TINT_ROLL[1] ? 1 : 2;
      }

      // Середина Млечного Пути: полоса идёт снизу слева вверх направо
      function bandY(x) { return h * (0.7 - 0.6 * x / w); }
      function gauss() { return Math.random() + Math.random() + Math.random() - 1.5; }

      function paintMilkyWay() {
        var c = document.createElement("canvas");
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
        var g = c.getContext("2d");
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        var bw = Math.min(w, h) * 0.16;
        for (var i = 0; i <= 14; i++) {
          var x = (i / 14) * w;
          var y = bandY(x) + gauss() * bw * 0.3;
          var glow = g.createRadialGradient(x, y, 0, x, y, bw * 1.7);
          glow.addColorStop(0, i % 2 ? "rgba(150,130,230,0.06)" : "rgba(150,190,240,0.045)");
          glow.addColorStop(1, "rgba(120,110,200,0)");
          g.fillStyle = glow;
          g.fillRect(x - bw * 1.7, y - bw * 1.7, bw * 3.4, bw * 3.4);
        }
        var dust = Math.round(w * h / DUST_AREA);
        for (var j = 0; j < dust; j++) {
          var dx = Math.random() * w;
          g.globalAlpha = 0.08 + Math.random() * 0.3;
          g.fillStyle = "rgb(" + TINTS[tint()] + ")";
          var size = 0.5 + Math.random() * 0.7;
          g.fillRect(dx, bandY(dx) + gauss() * bw, size, size);
        }
        return c;
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = innerWidth;
        h = innerHeight;
        if (!w || !h) return; // окно ещё не получило размер (Telegram раскрывается) — дождёмся resize
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        milkyWay = paintMilkyWay();
        stars = Array.from({ length: Math.round(w * h / STAR_AREA) }, function () {
          return {
            x: Math.random() * w, y: Math.random() * h, r: 0.35 + Math.pow(Math.random(), 2) * 1.2,
            tint: tint(), p: Math.random() * 6.28, s: 0.4 + Math.random() * 1.4,
            sparkle: Math.random() < SPARKLE_SHARE, size: 7 + Math.random() * 9,
          };
        });
        if (still) draw(0);
      }

      function drawStar(s, t) {
        var a = still ? 0.6 : 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t / 1000 * s.s + s.p));
        ctx.globalAlpha = a;
        if (s.sparkle) {
          ctx.drawImage(sprites[s.tint], s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
          return;
        }
        ctx.fillStyle = "rgb(" + TINTS[s.tint] + ")";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, 6.283);
        ctx.fill();
      }

      function drawMeteor(t) {
        if (!meteor && t >= nextMeteor) {
          var angle = (200 + Math.random() * 20) * Math.PI / 180;
          meteor = { x: w * (0.25 + Math.random() * 0.7), y: h * Math.random() * 0.35, dx: Math.cos(angle), dy: -Math.sin(angle), born: t, run: Math.min(w, h) * 0.45 };
        }
        if (!meteor) return;
        var k = (t - meteor.born) / METEOR_MS;
        if (k >= 1) {
          meteor = null;
          nextMeteor = t + METEOR_GAP_MS[0] + Math.random() * (METEOR_GAP_MS[1] - METEOR_GAP_MS[0]);
          return;
        }
        var hx = meteor.x + meteor.dx * meteor.run * k;
        var hy = meteor.y + meteor.dy * meteor.run * k;
        var tail = 90 + 60 * Math.sin(Math.PI * k);
        var trail = ctx.createLinearGradient(hx, hy, hx - meteor.dx * tail, hy - meteor.dy * tail);
        trail.addColorStop(0, "rgba(243,238,229,0.9)");
        trail.addColorStop(1, "rgba(201,179,255,0)");
        ctx.globalAlpha = Math.sin(Math.PI * k);
        ctx.strokeStyle = trail;
        ctx.lineWidth = 1.4;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx - meteor.dx * tail, hy - meteor.dy * tail);
        ctx.stroke();
      }

      function draw(t) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        if (!milkyWay) return;
        ctx.globalAlpha = 1;
        ctx.drawImage(milkyWay, 0, 0, w, h);
        for (var i = 0; i < stars.length; i++) drawStar(stars[i], t);
        if (!still) drawMeteor(t);
        ctx.globalAlpha = 1;
      }

      function loop(t) {
        draw(t);
        requestAnimationFrame(loop);
      }

      resize();
      addEventListener("resize", resize);
      if (!still) {
        nextMeteor = performance.now() + 2500;
        requestAnimationFrame(loop);
      }
    }
  </script>
</body>
</html>
